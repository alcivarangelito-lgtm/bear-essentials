<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bear Essential | Luxury Streetwear & Decants</title>

      theme: {

              400: '#C5A028',

              600: '#9A7007',

          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],

            luxury: ['Cinzel', 'serif']

  <style>
    body {
      background-color: #0A0A0A;
      color: #FFFFFF;
    }

    .glass-nav-overlay {
      background: rgba(10, 10, 10, 0.4);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    /* Efecto 3D Metálico / Cromo */
    .text-3d-metallic {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #F0F0F0;
      text-shadow: 
        0 1px 0 #cccccc,
        0 2px 0 #b0b0b0,
        0 3px 0 #999999,
        0 4px 0 #777777,
        0 5px 0 #555555,
        0 6px 1px rgba(0,0,0,0.3),
        0 0 25px rgba(255,255,255,0.6),
        0 0 50px rgba(212,175,55,0.4);
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-hero-content {
      animation: fadeInSlide 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Animación de marquesina infinita para las entregas */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: max-content;
      animation: marquee 25s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }

    /* Estilo de Tarjetas para la Fila Horizontal de Videos */
    .video-row-card {
      position: relative;
      background: #111111;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      flex: 0 0 300px;
      height: 420px;
    }
    @media (min-width: 768px) {
      .video-row-card {
        flex: 0 0 350px;
        height: 480px;
      }
    }
    .video-row-card:hover {
      border-color: #D4AF37;
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.25);
    }

    /* Tarjetas normales del Catálogo con transición de fotos */
    .minimal-card {
      background: #FFFFFF;
      color: #111111;
      border: 1px solid #E5E5E5;
      border-radius: 1rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }
    .minimal-card:hover {
      border-color: #D4AF37;
      box-shadow: 0 10px 30px rgba(212,175,55,0.15);
    }

    .img-container .img-secondary {
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }
    .minimal-card:hover .img-container .img-secondary {
      opacity: 1;
    }
    .minimal-card:hover .img-container .img-primary {
      opacity: 0;
    }
    .img-container .img-primary {
      transition: opacity 0.4s ease-in-out;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .option-pill {
      transition: all 0.25s ease;
      border: 1px solid #E5E5E5;
      background: #FFFFFF;
      color: #666666;
      cursor: pointer;
    }
    .option-pill:hover {
      border-color: #D4AF37;
      color: #111111;
    }
    .option-pill.active {
      background: rgba(212, 175, 55, 0.1);
      border-color: #D4AF37;
      color: #9A7007;
      font-weight: 700;
    }

    .btn-gold {
      background: linear-gradient(135deg, #F3D27A 0%, #D4AF37 50%, #B8860B 100%);
      color: #0A0A0A;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }
    .btn-gold:hover {
      box-shadow: 0 6px 28px rgba(212, 175, 55, 0.7);
      transform: translateY(-2px);
    }
