<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Essential | Exclusividad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #1a1a1a;
        }
        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        .nav-links, .nav-icons {
            display: flex;
            gap: 25px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #333;
        }
        .logo {
            font-weight: bold;
            letter-spacing: 3px;
            color: #d4af37; /* Dorado */
        }

        /* Hero Section de 3 columnas */
        .hero-container {
            display: flex;
            height: 100vh;
            padding-top: 70px; /* Espacio para el navbar fijo */
        }
        .hero-col {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-right: 2px solid #d4af37; /* Línea divisoria dorada */
        }
        .hero-col:last-child {
            border-right: none;
        }
        .hero-col img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.9);
            transition: transform 0.5s ease;
        }
        .hero-col:hover img {
            transform: scale(1.03);
        }
        
        /* Contenido superpuesto */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25); /* Oscurece sutilmente para Resaltar el texto */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hero-overlay h2 {
            color: #ffffff;
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn-gold {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #d4af37;
            padding: 12px 30px;
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: uppercase;
        }
        .btn-gold:hover {
            background-color: #d4af37;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav>
        <div class="nav-links">
            <span>INICIO</span>
            <span>GORRAS</span>
            <span>PERFUMES</span>
        </div>
        <div class="logo">BEAR ESSENTIAL</div>
        <div class="nav-icons">
            <span>ES</span>
            <span>BUScar</span>
            <span>CARRITO</span>
        </div>
    </nav>

    <!-- Sección Principal de 3 Columnas -->
    <section class="hero-container">
        <!-- Columna 1 -->
        <div class="hero-col">
            <img src="URL_IMAGEN_1.jpg" alt="Drop 1">
            <div class="hero-overlay">
                <h2>BEAR ESSENTIAL</h2>
                <a href="#comprar" class="btn-gold">COMPRAR</a>
            </div>
        </div>
        <!-- Columna 2 -->
        <div class="hero-col">
            <img src="URL_IMAGEN_2.jpg" alt="Drop 2">
            <div class="hero-overlay">
                <h2>NEW DROP</h2>
                <a href="#comprar" class="btn-gold">COMPRAR</a>
            </div>
        </div>
        <!-- Columna 3 -->
        <div class="hero-col">
            <img src="URL_IMAGEN_3.jpg" alt="Drop 3">
            <div class="hero-overlay">
                <h2>EXCLUSIVIDAD</h2>
                <a href="#comprar" class="btn-gold">COMPRAR</a>
            </div>
        </div>
    </section>

</body>
</html>
